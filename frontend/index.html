<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spam Email Classifier</title>

    <link rel="stylesheet" href="style.css">
    
</head>

<body>
    

    <div class="container">

        <div class="header">
            <h1>📧 Spam Email Classifier</h1>
            <p>Detect whether an email is Spam or Ham using Machine Learning</p>
        </div>

        <div class="card">

            <label for="email">Email Content</label>

            <textarea
                id="email"
                placeholder="Paste your email here..."></textarea>

            <button id="checkBtn">
                🔍 Check Email
            </button>

            <div id="result">

                <div class="result-title">
                    Prediction Result
                </div>

                <div class="prediction">
                    —
                </div>

                <div class="probability">
                    -
                </div>


            </div>

        </div>

        <div class="footer">
            Spam Email Classifier • Machine Learning Project
        </div>

    </div>
    <script src="script.js"></script>

</body>

</html>
